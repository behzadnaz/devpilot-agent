
[project]
name = "devpilot-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "ollama==0.6.3",
    "PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["app", "web", "environment"]
python_files = ["_*_test.py"]
python_classes = ["_*Test"]
python_functions = ["test_*"]
